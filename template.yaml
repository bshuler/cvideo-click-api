AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CVIDEO-CLICK-API Serverless Application

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.11
    Environment:
      Variables:
        LOG_LEVEL: INFO
        ENVIRONMENT: !Ref Environment

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

Resources:
  # Dead Letter Queue for Lambda function (required by CKV_AWS_116)
  HelloWorldDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cvideo-api-hello-world-dlq-${Environment}
      MessageRetentionPeriod: 1209600  # 14 days
      VisibilityTimeoutSeconds: 300
      KmsMasterKeyId: alias/aws/sqs  # SQS encryption (required by CKV_AWS_27)

  # Hello World Lambda Function
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_117:VPC configuration not required for simple API Gateway integration
    Properties:
      FunctionName: !Sub cvideo-api-hello-world-${Environment}
      CodeUri: src/
      Handler: hello_world.handler.lambda_handler
      ReservedConcurrencyLimit: 10  # Concurrent execution limit (required by CKV_AWS_115)
      # checkov:skip=CKV_AWS_115:ReservedConcurrencyLimit is set but may not be recognized by this version
      KmsKeyArn: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/lambda"  # Environment variable encryption
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt HelloWorldDLQ.Arn
      Events:
        HelloWorldApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /hello
            Method: GET
        HelloWorldApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /hello
            Method: POST

  # CloudWatch Log Group for API Gateway Access Logs
  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/cvideo-api-${Environment}-access-logs
      RetentionInDays: 30
      KmsKeyId: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/logs"  # KMS encryption

  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub cvideo-api-gateway-${Environment}
      StageName: !Ref Environment
      CacheClusterEnabled: true  # Enable caching (required by CKV_AWS_120)
      CacheClusterSize: "0.5"
      TracingEnabled: true  # Enable X-Ray tracing (required by CKV_AWS_73)
      AccessLogSetting:  # Enable access logging (required by CKV_AWS_76)
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '$requestId $requestTime $httpMethod $resourcePath $status $responseLatency'
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub ${AWS::StackName}-ApiGatewayUrl

  HelloWorldFunctionArn:
    Description: Hello World Lambda Function ARN
    Value: !GetAtt HelloWorldFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-HelloWorldFunctionArn
