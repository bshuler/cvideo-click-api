AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CVIDEO-CLICK-API Serverless Application

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.11
    Environment:
      Variables:
        LOG_LEVEL: INFO
        ENVIRONMENT: !Ref Environment
    # Enable Lambda environment variable encryption (required by CKV_AWS_173)
    KmsKeyArn: alias/aws/lambda

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  Branch:
    Type: String
    Default: main
    Description: Git branch name for namespace isolation

Resources:
  # Dead Letter Queue for Lambda function (required by CKV_AWS_116)
  HelloWorldDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub
        - cvideo-api-${BranchSafe}-hello-world-dlq-${Environment}
        - BranchSafe: !Join ["-", !Split ["/", !Join ["-", !Split ["_", !Ref Branch]]]]
      MessageRetentionPeriod: 1209600  # 14 days
      VisibilityTimeout: 300
      # Enable SQS encryption with AWS managed key (required by CKV_AWS_27)
      KmsMasterKeyId: alias/aws/sqs

  # Hello World Lambda Function
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_117:VPC configuration not required for simple API Gateway integration
    Properties:
      FunctionName: !Sub
        - cvideo-api-${BranchSafe}-hello-world-${Environment}
        - BranchSafe: !Join ["-", !Split ["/", !Join ["-", !Split ["_", !Ref Branch]]]]
      CodeUri: src/
      Handler: hello_world.handler.lambda_handler
      # ReservedConcurrentExecutions removed - using default unreserved concurrency to avoid account limits
      # checkov:skip=CKV_AWS_115:Using default unreserved concurrency for account compatibility
      # KmsKeyArn removed - using default encryption to avoid key access issues
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt HelloWorldDLQ.Arn
      # Events temporarily removed to avoid API Gateway Service Linked Role issues
      # Events:
      #   HelloWorldApi:
      #     Type: Api
      #     Properties:
      #       RestApiId: !Ref ApiGateway
      #       Path: /hello
      #       Method: GET
      #   HelloWorldApiPost:
      #     Type: Api
      #     Properties:
      #       RestApiId: !Ref ApiGateway
      #       Path: /hello
      #       Method: POST

  # API Gateway temporarily removed to avoid Service Linked Role issues
  # ApiGateway:
  #   Type: AWS::Serverless::Api
  #   Properties:
  #     Name: !Sub
  #       - cvideo-api-${BranchSafe}-gateway-${Environment}
  #       - BranchSafe: !Join ["-", !Split ["/", !Join ["-", !Split ["_", !Ref Branch]]]]
  #     StageName: !Ref Environment
  #     CacheClusterEnabled: true  # Enable caching (required by CKV_AWS_120)
  #     CacheClusterSize: "0.5"
  #     TracingEnabled: true  # Enable X-Ray tracing (required by CKV_AWS_73)
  #     # AccessLogSetting removed - avoiding Service Linked Role requirement for developer account
  #     # checkov:skip=CKV_AWS_76:Access logging disabled for developer account compatibility
  #     Cors:
  #       AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
  #       AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
  #       AllowOrigin: "'*'"

Outputs:
  # ApiGatewayUrl:
  #   Description: API Gateway endpoint URL
  #   Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  #   Export:
  #     Name: !Sub ${AWS::StackName}-ApiGatewayUrl

  HelloWorldFunctionArn:
    Description: Hello World Lambda Function ARN
    Value: !GetAtt HelloWorldFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-HelloWorldFunctionArn
